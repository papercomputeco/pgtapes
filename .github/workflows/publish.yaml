name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Publish images
    runs-on: depot-ubuntu-24.04-4
    env:
      TAG: 17.7-pgduckdb-1.1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CloudNativePG tag
        run: make validate-tag TAG="$TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY }}/postgres:${{ env.TAG }}
          cache-from: type=gha,scope=pgtapes-postgres
          cache-to: type=gha,mode=max,scope=pgtapes-postgres
          provenance: false
          sbom: false
